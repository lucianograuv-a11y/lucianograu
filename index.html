 remo2:{n:"Remo con mochila (dos manos)",v:"h1WBkphGkN0",
  i:"De pie, pies al ancho de las caderas y rodillas un poco dobladas. Llevas la cadera atrás hasta que el torso quede a unos 45°, con la espalda recta. Tomas la mochila de las tiras, brazos estirados.",

  r:"Botas el aire al subir y lo tomas al bajar.",
  e:"Encoger los hombros hacia las orejas, redondear la espalda o tirar con impulso del torso."},
 remo1:{n:"Remo con una mano, apoyado en la silla",v:"pHEzSV5CjbQ",

 curl:{n:"Curl de bíceps con mochila o bidón",v:"vjoIGHYiCjw",

 sentadilla:{n:"Sentadilla",v:"BjixzWEw4EY",

 rumano:{n:"Peso muerto rumano con mochila",v:"ujlI1EmWBBo",

 zancada:{n:"Zancada hacia atrás",v:"iQcb_o9kNiE",

   <li>Partida: remo con dos manos 5 a 7 kg · remo con una mano 4 a 6 · peso muerto rumano 6 a 8 · curl 2 a 4 · tríceps 2 a 4 · press de hombros 3 a 5.</li>
   <li>Sentadilla y zancada, primero sin peso: la mochila entra cuando hagas 15 repeticiones con 2 RIR. Flexiones sin mochila hasta pasar de 15.</li>
   <li>Para subir: 1 a 1,5 kg (en curl, tríceps y hombros, 0,5 a 1 kg).</li>
   <li>Ajusta las dos tiras, lo pesado al fondo y rellena con ropa. Revisa las costuras antes de pasar de 8 kg.</li></ul></details>
  <details><summary>Esfuerzo (RIR) y progresión</summary><ul>
   <li>RIR = cuántas repeticiones más podrías haber hecho.</li>
   <li>Semanas 1 y 2 (10 al 22 de noviembre): técnica, con 3 RIR.</li>
   <li>Semanas 3 y 4: 2 RIR, sumando 1 repetición por serie cada semana.</li>
   <li>Semanas 5 a 8: 1-2 RIR en los ejercicios grandes.</li>
   <li>Si haces todas las series en el máximo del rango y te quedan unas 2 → agrega un libro o una botella. Es normal que bajen las repeticiones.</li>
   <li>No llegues al fallo en las semanas 1 a 4, y nunca en los ejercicios de cuello.</li></ul></details>
  <details><summary>Recuperación y proteína</summary><ul>
   <li>Si un músculo sigue muy adolorido el día de su sesión, haz 1 serie menos por ejercicio.</li>
   <li>Duerme lo más cerca posible de 7 horas.</li>
   <li>Proteína: unos 105 g al día repartidos en 3 o 4 comidas (huevos, legumbres, leche, yogur, atún, pollo).</li></ul></details>
  <details><summary>Cuello, hombros y pecho: seguridad</summary><ul>
   <li>Detén cualquier ejercicio si aparece dolor agudo o que aumenta, hormigueo, debilidad, mareo o dolor que baja al brazo. Si se repite → kinesiólogo o médico.</li>
   <li>No se usan puentes de cuello, peso sobre la cabeza ni movimientos bruscos del cuello.</li>
   <li>Si notas un tejido duro bajo el pezón, dolor o diferencias entre un lado y otro, conviene una consulta médica.</li></ul></details>
 </div>`;
function mascot(){
  const [s,n]=progressOf(cur);const r=n?s/n:0;
  const k=r>=1?"motivado":r>=.5?"contento":r>0?"tranquilo":"curioso";
  document.getElementById("mascot").innerHTML=`<path d="${BLOB}" fill="var(--sun)"/><circle cx="58" cy="8" r="3" fill="var(--ink)"/><circle cx="6" cy="54" r="2" fill="var(--ink)"/><g transform="translate(8 9)">${faceInner(k)}</g>`;
}
const TITLES={hoy:"Hoy",semana:"Semana",guia:"Guía",resumen:"Resumen"};
function render(){
  const v=document.getElementById("view");
  const focusId=document.activeElement&&document.activeElement.id;
  v.innerHTML=tab==="hoy"?viewHoy():tab==="semana"?viewSemana():tab==="guia"?GUIA_TAB:viewResumen();
  document.getElementById("viewTitle").textContent=TITLES[tab];
  document.querySelectorAll("nav.tabs button").forEach(b=>b.dataset.tab===tab?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current"));
  mascot();
  if(focusId){const el=document.getElementById(focusId);if(el&&el!==document.activeElement){el.focus();}}
}

/* ───────── EVENTOS ───────── */
const view=document.getElementById("view");
document.querySelector("nav.tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.tab;try{history.replaceState(null,"","#"+tab);}catch(_){}render();window.scrollTo(0,0);});
view.addEventListener("toggle",e=>{const d=e.target;if(d.dataset&&d.dataset.k)openD[d.dataset.k]=d.open;},true);
function copyText(txt,btn){
  const ok=()=>{const o=btn.textContent;btn.textContent="Copiado ✓";setTimeout(()=>{btn.textContent=o;},1800);};
  const fallback=()=>{const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");ok();}catch(e){btn.textContent="Mantén presionado el texto para copiarlo";}ta.remove();};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(ok,fallback);else fallback();
}
view.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  if(a==="prev"||a==="next"){const i=PLAN.findIndex(p=>p.f===cur);const j=Math.max(0,Math.min(PLAN.length-1,i+(a==="next"?1:-1)));cur=PLAN[j].f;render();return;}
  if(a==="goto"){cur=b.dataset.f;render();return;}
  if(a==="open"){cur=b.dataset.f;tab="hoy";render();window.scrollTo(0,0);return;}
  if(a==="st"){const L=getLog(b.dataset.f);const t=L.tareas[b.dataset.id]=L.tareas[b.dataset.id]||{};t.estado=t.estado===b.dataset.v?"":b.dataset.v;touch(b.dataset.f);render();return;}
  if(a==="paso"){const L=getLog(b.dataset.f);const t=L.tareas[b.dataset.id]=L.tareas[b.dataset.id]||{};t.pasos=t.pasos||{};const i=b.dataset.i;
    if(t.pasos[i])delete t.pasos[i];else t.pasos[i]=1;touch(b.dataset.f);render();return;}
  if(a==="copy"){copyText(b.dataset.txt,b);return;}
  if(a==="agua"){const L=getLog(cur);L.agua=Math.max(0,(+L.agua||0)+(+b.dataset.v)*AJ.vaso);touch(cur);render();return;}
  if(a==="ajv"||a==="ajm"){AJ[a==="ajv"?"vaso":"meta"]=+b.dataset.v;saveAJ();render();return;}
  if(a==="rir"){const L=getLog(b.dataset.f);const v=+b.dataset.v;L.rir=L.rir===v?null:v;touch(b.dataset.f);render();return;}
  if(a==="cuerpo"||a==="mente"||a==="nCuerpo"||a==="nMente"){const L=getLog(cur);const v=+b.dataset.v;L[a]=L[a]===v?null:v;touch(cur);render();return;}
  if(a==="emo"||a==="nEmo"){const L=getLog(cur);const sel=emoList(L,a),k=b.dataset.v;
    if(sel.includes(k))L[a]=sel.filter(x=>x!==k);
    else if(sel.length>=MAXEMO){setStatus("Máximo "+MAXEMO+" emociones: quita una para elegir otra");return;}
    else L[a]=[...sel,k];
    touch(cur);render();return;}
  if(SCALE_FN[a]&&b.classList.contains("unset"))setScale(b);
  if(a==="export"){const clean={};Object.keys(logs).sort().forEach(k=>{if(PLAN.some(p=>p.f===k))clean[k]=logs[k];});
    const txt="REGISTRO PLAN LUCIANO "+TODAY+"\n"+JSON.stringify(clean);
    const ta=document.getElementById("expTxt"),msg=document.getElementById("expMsg");ta.value=txt;ta.hidden=false;
    const fallback=()=>{ta.focus();ta.select();try{document.execCommand("copy");msg.textContent="Copiado ✓ Pégalo en el chat de Claude.";}catch(e){msg.textContent="Mantén presionado el texto → Seleccionar todo → Copiar.";}};
    if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(()=>{msg.textContent="Copiado ✓ Pégalo en el chat de Claude.";},fallback);else fallback();return;}
  if(a==="import"){const msg=document.getElementById("impMsg");try{const raw=document.getElementById("impTxt").value;const data=JSON.parse(raw.slice(raw.indexOf("{")));
    if(!data||typeof data!=="object")throw 0;let n=0;Object.keys(data).forEach(k=>{if(/^\d{4}-\d\d-\d\d$/.test(k)&&data[k]&&typeof data[k]==="object"){logs[k]=data[k];n++;}});
    if(!n)throw 0;try{localStorage.setItem("plan-luciano",JSON.stringify(logs));}catch(e){}render();setStatus("Importados "+n+" días ✓");}
    catch(e){msg.textContent="Ese texto no parece un registro de esta app.";}return;}
});
function setScale(el){const L=getLog(cur),a=el.dataset.act,v=+el.value;L[a]=v;el.classList.remove("unset");
  document.getElementById("o-"+a).textContent=v+" "+SCALE_FN[a](v);touch(cur);}
view.addEventListener("input",e=>{
  const el=e.target,a=el.dataset.act;if(!a)return;
  if(a==="min"||a==="nota"){const L=getLog(el.dataset.f);const t=L.tareas[el.dataset.id]=L.tareas[el.dataset.id]||{};t[a]=el.value;touch(el.dataset.f);return;}
  if(a==="ejr"||a==="ejc"){const L=getLog(el.dataset.f);L.ejer=L.ejer||{};const k="e"+el.dataset.i;L.ejer[k]=L.ejer[k]||{};L.ejer[k][a==="ejr"?"reps":"carga"]=el.value;touch(el.dataset.f);return;}
  if(a==="tx"){const L=getLog(el.dataset.f);L.ejer=L.ejer||{};L.ejer[el.dataset.k2]=el.value;touch(el.dataset.f);return;}
  if(SCALE_FN[a]){setScale(el);return;}
  if(a==="import")return;
  const L=getLog(cur);
  L[a]=el.value;
  if(a==="dur"||a==="desp"){const h=horasDormidas(L);document.getElementById("slept").textContent=h!=null?"Dormiste unas "+fh(h)+" horas":"Las horas dormidas se calculan solas";}
  touch(cur);
});

/* ───────── ARRANQUE ───────── */
const h=(location.hash||"").slice(1);if(TITLES[h])tab=h;
render();
let storageOK=true;
try{localStorage.setItem("__t","1");localStorage.removeItem("__t");}catch(e){storageOK=false;}
mode="local";
try{Object.assign(logs,JSON.parse(localStorage.getItem("plan-luciano")||"{}"));}catch(e){}
setStatus(storageOK?"Guardado en este teléfono":"⚠️ Este teléfono no deja guardar así: al final del día usa «Copiar mi registro» en Resumen");
render();
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{});}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
</script>
