<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef3f7">
<title>Mi cuaderno de inglés</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Hermano de «Plan»: mismo papel y tipografías, con acento azul cielo. */
:root{
  --bg:#eef3f7; --surface:#fbfcfd; --ink:#1c1a17; --muted:#5f6670; --line:#d3dde6; --meta:#2f6fd0;
  --on-vivid:#1c1a17; --acc:#3fb5e6; --acc-soft:#cfeefa; --sun:#ffc549; --ok:#00b487; --ok-soft:#d9f2e8; --no:#ee8577; --no-soft:#fbdcd8;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",Verdana,"Segoe UI",system-ui,sans-serif;
  --f-meta:"Instrument Serif",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121619; --surface:#1b2126; --ink:#eef2f5; --muted:#a6b0ba; --line:#33404a; --meta:#8cb8ff; --acc-soft:#173847; --ok-soft:#173a30; --no-soft:#432220; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121619; --surface:#1b2126; --ink:#eef2f5; --muted:#a6b0ba; --line:#33404a; --meta:#8cb8ff; --acc-soft:#173847; --ok-soft:#173a30; --no-soft:#432220; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:17px;line-height:1.45;margin:0}
.wrap{max-width:640px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 110px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:2.2rem;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.5rem;font-weight:800}
h3{font-size:1.12rem;font-weight:800}
.meta{font-family:var(--f-meta);color:var(--meta);font-size:1rem;line-height:1.25}
.meta.caps{text-transform:uppercase;font-size:.86rem;letter-spacing:.06em}
.muted{color:var(--muted)} .small{font-size:.9rem}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top svg{width:70px;height:70px;flex:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--meta);outline-offset:2px}
.card{background:var(--surface);border:2px solid var(--ink);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.soft{border-color:var(--line)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
input[type=text],input[type=search],textarea{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:8px 10px;width:100%;min-height:44px}
input:focus,textarea:focus{border-color:var(--ink);outline:none}
textarea{min-height:64px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:3px;font-size:.84rem;color:var(--muted);flex:1;min-width:130px}
.btn{min-height:44px;border-radius:14px;border:2px solid var(--ink);background:transparent;font-weight:700;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.main{background:var(--acc);color:var(--on-vivid)}
.btn.sun{background:var(--sun);color:var(--on-vivid)}
.btn.ghost{border-color:var(--line)}
.btn.sm{min-height:38px;padding:0 10px;font-size:.9rem;border-radius:12px}
.icon{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:transparent;font-size:1.15rem;display:grid;place-items:center;flex:none;text-decoration:none;color:var(--ink)}
.daynav{display:flex;align-items:center;gap:8px}
.daynav .t{flex:1;min-width:0}
.prog{height:12px;border-radius:10px;border:2px solid var(--ink);overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc)}
/* palabras */
.word{border-top:2px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.word:first-of-type{border-top:0;padding-top:0}
.wtop{display:flex;align-items:center;gap:8px}
.wtop b{font-family:var(--f-display);font-size:1.3rem;flex:1;min-width:0;overflow-wrap:anywhere}
.wmean{font-family:var(--f-meta);font-size:1.12rem;color:var(--muted)}
.wsent{font-style:italic}
.voz{display:flex;gap:6px;align-items:center}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:transparent;min-height:38px;padding:0 12px;font-weight:700;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--on-vivid)}
/* oraciones */
.sent{display:flex;flex-direction:column;gap:8px;border-top:2px dashed var(--line);padding-top:10px}
.sent:first-of-type{border-top:0;padding-top:0}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.ck{min-height:36px;border-radius:18px;border:2px solid var(--line);background:transparent;padding:0 10px;font-size:.84rem;font-weight:700;text-align:left}
.ck[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok)}
.ck[aria-pressed="true"]::before{content:"✓ "}
.warn{font-size:.86rem;background:var(--no-soft);border-radius:10px;padding:6px 10px}
.tip{font-size:.86rem;color:var(--muted)}
/* gramática y notas */
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
details.topic>summary{font-family:var(--f-display);font-weight:800;font-size:1.1rem;display:flex;gap:8px;align-items:baseline}
details.topic>summary::before{content:"›";transition:transform .2s;display:inline-block}
details.topic[open]>summary::before{transform:rotate(90deg)}
.ex{font-family:var(--f-meta);font-style:italic;font-size:1.1rem;color:var(--meta)}
.gt{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.gt p{margin:0}
.pair{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:baseline}
.pair b{font-family:var(--f-display)}
.note{background:var(--acc-soft);border-radius:14px 16px 12px 15px;padding:8px 10px;display:flex;gap:8px;align-items:flex-start}
.note p{margin:0;flex:1;white-space:pre-wrap}
.x{border:0;background:none;font-size:1.1rem;min-width:32px;min-height:32px;color:var(--muted)}
.qbox{background:var(--bg);border-radius:12px;padding:8px 10px;font-size:.94rem}
/* errores */
.err{display:grid;grid-template-columns:1fr auto;gap:2px 8px;border-top:2px dashed var(--line);padding-top:8px}
.err:first-of-type{border-top:0;padding-top:0}
.err s{color:var(--no);text-decoration-thickness:2px}
.err .c{font-weight:700;color:var(--ok)}
.err .d{grid-column:1/-1;font-size:.8rem;color:var(--muted)}
/* apps */
.app{display:flex;align-items:center;gap:10px;border-top:2px dashed var(--line);padding-top:10px}
.app:first-of-type{border-top:0;padding-top:0}
.app .n{flex:1;min-width:0}
.app .n b{display:block}
.app .n span{font-size:.84rem;color:var(--muted)}
.mk{width:28px;height:28px;border-radius:8px;border:2px solid var(--ink);background:transparent;flex:none}
.mk[aria-pressed="true"]{background:var(--ok)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:2px solid var(--ink);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs button{flex:1;min-height:60px;border:0;background:none;font-family:var(--f-display);font-weight:800;font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav.tabs button span{font-size:1.1rem;width:34px;height:26px;display:grid;place-items:center;border-radius:13px}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] span{background:var(--acc);color:var(--on-vivid)}
.empty{color:var(--muted);margin:0}
</style></head><body>
<div class="wrap">
 <div class="top"><div><div class="meta caps">Mi cuaderno de inglés · desde el 2 nov</div><h1 id="title">Hoy</h1><div class="meta" id="status"></div></div>
  <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M8 10Q8 4 14 4H50Q56 4 56 10V38Q56 44 50 44H28L16 56V44H14Q8 44 8 38Z" fill="var(--acc)" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/><text x="32" y="32" text-anchor="middle" font-family="Bricolage Grotesque,sans-serif" font-weight="800" font-size="20" fill="#1c1a17">Aa</text></svg></div>
 <main id="view"></main>
</div>
<nav class="tabs" aria-label="Secciones">
 <button data-tab="hoy"><span>☀</span>Hoy</button>
 <button data-tab="palabras"><span>Aa</span>Palabras</button>
 <button data-tab="gramatica"><span>§</span>Gramática</button>
 <button data-tab="errores"><span>✗</span>Errores</button>
 <button data-tab="ruta"><span>➜</span>Ruta</button>
</nav>
<script>
/* ───────── DATOS ───────── */
const KEY="cuaderno-ingles";
const iso=d=>d.toLocaleDateString("sv-SE");
const TODAY=iso(new Date());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const SEED={v:1,
 vocab:[{id:"w1",d:"2026-11-02",w:"windy",s:"ventoso",o:"It's windy today."},{id:"w2",d:"2026-11-02",w:"ship",s:"barco",o:"The ship is big."}],
 ora:{}, err:[{id:"e1",e:"she's wearing hat",c:"she's wearing a hat",d:"2026-11-02"},{id:"e2",e:"because is busy",c:"because it's busy",d:"2026-11-02"},
  {id:"e3",e:"I prefer stay",c:"I prefer to stay",d:"2026-11-02"},{id:"e4",e:"mom's cell",c:"my mom's cell phone",d:"2026-11-02"}],
 notas:{}, temas:[], ruta:{}, mes:{}, voz:"en-US"};
let D;
try{D=JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){D=null;}
if(!D)D=JSON.parse(JSON.stringify(SEED));
let storageOK=true;
function save(msg){try{localStorage.setItem(KEY,JSON.stringify(D));setStatus(msg||"Guardado en este teléfono ✓");}catch(e){storageOK=false;setStatus("⚠️ No se pudo guardar: usa «Copiar mi cuaderno» en Ruta");}}
let saveT;const saveSoon=()=>{clearTimeout(saveT);setStatus("Guardando…");saveT=setTimeout(save,500);};
const setStatus=t=>{document.getElementById("status").textContent=t;};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=(f,o)=>new Date(f+"T12:00:00").toLocaleDateString("es-CL",o||{weekday:"long",day:"numeric",month:"long"});
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const addDays=(f,n)=>{const d=new Date(f+"T12:00:00");d.setDate(d.getDate()+n);return iso(d);};
const FIRST="2026-11-02";   // el cuaderno parte el lunes 2 de noviembre, igual que «Plan»
let tab="hoy", cur=TODAY<FIRST?FIRST:TODAY, q="";
const openD={};const isOpen=(k,def)=>k in openD?openD[k]:def;

/* ───────── VOZ ───────── */
let voices=[];
const loadVoices=()=>{try{voices=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));}catch(e){voices=[];}};
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function speak(text){
  if(!("speechSynthesis" in window)){setStatus("Este teléfono no tiene voz: usa el botón de Cambridge");return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang=D.voz;u.rate=.85;
  const v=voices.find(x=>x.lang.replace("_","-").toLowerCase()===D.voz.toLowerCase())||voices.find(x=>x.lang.toLowerCase().startsWith("en"));
  if(v)u.voice=v;
  speechSynthesis.speak(u);
}
const camb=w=>"https://dictionary.cambridge.org/dictionary/english/"+encodeURIComponent(w.trim().toLowerCase().replace(/\s+/g,"-"));
const vozSeg=()=>`<div class="seg" role="group" aria-label="Acento de la voz"><button data-act="voz" data-v="en-US" aria-pressed="${D.voz==="en-US"}">🇺🇸 US</button><button data-act="voz" data-v="en-GB" aria-pressed="${D.voz==="en-GB"}">🇬🇧 UK</button></div>`;
const sayBtns=w=>`<button class="icon" data-act="say" data-t="${esc(w)}" aria-label="Escuchar ${esc(w)}">🔊</button><a class="icon" href="${camb(w)}" target="_blank" rel="noopener" aria-label="Ver ${esc(w)} en Cambridge Dictionary" title="Cambridge Dictionary">📘</a>`;

/* ───────── CONTROL DE ORACIONES ───────── */
const MODALS=/\b(can|could|will|would|should|must|may|might|shall)\b|'d\b|'ll\b/i;
const BASE=[["suj","Tiene sujeto"],["verb","Verbo bien conjugado (I am · he/she/it is · you/we/they are)"],["comp","Tiene complemento"],
 ["art","a/an con sustantivo contable singular"],["adj","Adjetivo antes del sustantivo (a red hat)"],["punt","Mayúscula al inicio y punto al final"]];
function rulesFor(t){
  const r=[...BASE], s=" "+t.toLowerCase()+" ";
  if(/\b(in|on|at)\b/.test(s))r.push(["prep","in / on / at bien usado (in Chile · on Monday · at 7:00)"]);
  if(/\b(this|that|these|those)\b/.test(s))r.push(["dem","this/that singular · these/those plural"]);
  if(/\bthere\b/.test(s))r.push(["there","there is + singular · there are + plural"]);
  if(/\b(want|need|like|prefer|would|rather|better|can|could|should|must|will)\b|'d\b/.test(s))r.push(["to","to + verbo (want to go) · sin to después de un modal (I can go, I'd rather stay)"]);
  return r;
}
function autoWarn(t){
  const w=[];const s=t.trim();if(!s)return w;
  if(/\b(can|could|will|would|should|must|may|might)\s+to\b/i.test(s)||/'d\s+(rather|better)\s+to\b/i.test(s)||/'d\s+to\b/i.test(s))w.push("Después de un modal no va «to»: I can go, I'd rather stay.");
  if(/\b(want|need|prefer)\s+(?!to\b|a\b|an\b|the\b|my\b|your\b|his\b|her\b|it\b|this\b|that\b|some\b|more\b|help\b)[a-z]+/i.test(s))w.push("Ojo: después de want / need / prefer + verbo va «to» (I want to go).");
  if(/\b(he|she|it)\s+are\b|\b(you|we|they)\s+is\b|\bi\s+(is|are)\b/i.test(s))w.push("Revisa el verbo to be: I am · he/she/it is · you/we/they are.");
  if(/\bthere\s+is\s+(two|three|four|five|many|some|\d+)\b/i.test(s))w.push("Con plural va «there are».");
  if(/\b(these|those)\s+is\b|\b(this|that)\s+are\b/i.test(s))w.push("this/that van con is · these/those con are.");
  if(!/^[A-Z]/.test(s)||!/[.!?]$/.test(s))w.push("Falta mayúscula al inicio o punto al final.");
  return w;
}

/* ───────── VISTAS ───────── */
function daynav(){
  return `<div class="daynav"><button class="icon" data-act="day" data-n="-1" aria-label="Día anterior"${cur<=FIRST?' disabled style="opacity:.3"':""}>‹</button>
   <div class="t"><h2>${cap(fmt(cur))}</h2><div class="meta">${cur===TODAY?"Hoy":cur<TODAY?"Día pasado":"Día que viene"}</div></div>
   <button class="icon" data-act="day" data-n="1" aria-label="Día siguiente">›</button></div>`;
}
function wordHTML(x){
  return `<div class="word"><div class="wtop"><b lang="en">${esc(x.w)}</b>${sayBtns(x.w)}<button class="x" data-act="delw" data-id="${x.id}" aria-label="Borrar ${esc(x.w)}">✕</button></div>
   ${x.s?`<div class="wmean">${esc(x.s)}</div>`:""}
   ${x.o?`<div class="row"><span class="wsent sp" lang="en">${esc(x.o)}</span><button class="icon" data-act="say" data-t="${esc(x.o)}" aria-label="Escuchar la oración">🔊</button></div>`:""}
   ${x.d?`<div class="tip">${cap(fmt(x.d,{weekday:"short",day:"numeric",month:"short"}))}</div>`:""}</div>`;
}
function viewHoy(){
  const words=D.vocab.filter(x=>x.d===cur), n=words.length;
  const ora=(D.ora[cur]||[{t:"",c:{}},{t:"",c:{}},{t:"",c:{}}]);
  const nOra=ora.filter(o=>o.t.trim()).length;
  return `${daynav()}
  <div class="card"><div class="row"><h3 class="sp">5 palabras nuevas</h3><span class="meta">${n} de 5</span></div>
   <div class="prog" aria-hidden="true"><i style="width:${Math.min(100,n*20)}%"></i></div>
   ${words.map(wordHTML).join("")}
   ${n<5||isOpen("addw",false)?`<div class="card soft" style="gap:8px">
    <div class="row"><label class="f">Palabra en inglés<input id="nw" type="text" autocapitalize="off" autocomplete="off" spellcheck="false" lang="en"></label></div>
    <div class="row"><label class="f">Significado<input id="ns" type="text"></label></div>
    <div class="row"><label class="f">Mi oración<input id="no" type="text" lang="en" placeholder="Usa la palabra en una oración tuya"></label></div>
    <div class="row"><button class="btn main" data-act="addw">+ Agregar palabra</button><button class="btn ghost sm" data-act="trynew">🔊 Probar</button><span class="tip sp">Después puedes oírla o verla en Cambridge.</span></div>
   </div>`:`<p class="tip" style="margin:0">¡Listas las 5! 🎉 <button class="btn ghost sm" data-act="morew">+ Otra</button></p>`}
   <div class="row"><span class="tip sp">Voz del teléfono:</span>${vozSeg()}</div>
  </div>
  <div class="card"><div class="row"><h3 class="sp">Mis 3 oraciones</h3><span class="meta">${nOra} de 3</span></div>
   <p class="tip" style="margin:0">Escribe sobre tu día. Después revisa cada punto y márcalo.</p>
   ${ora.map((o,i)=>{const R=rulesFor(o.t),W=autoWarn(o.t);return `<div class="sent">
    <div class="row"><label class="f">Oración ${i+1}<input id="o${i}-${cur}" type="text" lang="en" data-act="ora" data-i="${i}" value="${esc(o.t)}" autocapitalize="sentences"></label>${o.t.trim()?`<button class="icon" data-act="say" data-t="${esc(o.t)}" aria-label="Escuchar la oración">🔊</button>`:""}</div>
    ${o.t.trim()?`<div class="checks">${R.map(([k,l])=>`<button class="ck" data-act="ck" data-i="${i}" data-k="${k}" aria-pressed="${!!(o.c||{})[k]}">${l}</button>`).join("")}</div>
    ${W.map(w=>`<div class="warn">⚠️ ${w}</div>`).join("")}`:""}</div>`;}).join("")}
   ${nOra?`<button class="btn sun" data-act="copyora">📋 Copiar para Claude</button><span class="tip" id="copyMsg">Pégalo en tu chat de inglés: te corrige cada oración y la regla que falló.</span>`:""}
  </div>
  <div class="card soft"><h3>¿Te corrigieron algo hoy?</h3>
   <div class="row"><label class="f">Lo que escribí<input id="ne" type="text" lang="en"></label><label class="f">La corrección<input id="nc" type="text" lang="en"></label></div>
   <button class="btn" data-act="adde">+ Al registro de errores</button></div>`;
}
function viewPalabras(){
  const list=D.vocab.filter(x=>!q||(x.w+" "+x.s+" "+x.o).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>b.d.localeCompare(a.d)||a.w.localeCompare(b.w));
  const days=[...new Set(list.map(x=>x.d))];
  return `<h2>Parte 2 · Vocabulario</h2>
  <div class="row"><input type="search" id="q" data-act="q" placeholder="Buscar palabra, significado u oración" value="${esc(q)}"></div>
  <div class="row"><span class="meta sp">${D.vocab.length} palabras en total</span>${vozSeg()}</div>
  ${days.length?days.map(d=>`<div class="card"><h3>${cap(fmt(d,{weekday:"long",day:"numeric",month:"long"}))}</h3>${list.filter(x=>x.d===d).map(wordHTML).join("")}</div>`).join(""):`<p class="empty">${q?"Nada coincide con la búsqueda.":"Todavía no hay palabras. Agrégalas en «Hoy»."}</p>`}`;
}

/* gramática: tus 5 temas */
const GRAM=[
 ["svc","1. Sujeto + verbo + complemento",`<p class="ex" lang="en">She is happy. The hat is red. I want to go home.</p>
  <div class="pair"><b>I</b><span>am</span><b>he / she / it</b><span>is</span><b>you / we / they</b><span>are</span></div>
  <p>El adjetivo va <b>antes</b> del sustantivo: <span class="ex" lang="en">a red hat</span>.</p>
  <p>Contable singular lleva <b>a/an</b>: <span class="ex" lang="en">she's wearing a hat</span>.</p>
  <p class="qbox">Pregunta de control: ¿tiene mi oración un sujeto y un verbo?</p>`],
 ["dem","2. This / that / these / those",`<div class="pair">
  <b lang="en">This</b><span>este/esta · cerca, singular · is → <span class="ex" lang="en">This is my car.</span></span>
  <b lang="en">That</b><span>ese/aquel · lejos, singular · is → <span class="ex" lang="en">That is a plane.</span></span>
  <b lang="en">These</b><span>estos/estas · cerca, plural · are → <span class="ex" lang="en">These are my keys.</span></span>
  <b lang="en">Those</b><span>esos/aquellos · lejos, plural · are → <span class="ex" lang="en">Those are my friends.</span></span></div>`],
 ["prep","3. In / on / at",`<div class="pair">
  <b lang="en">In</b><span>dentro, países, meses, años → <span class="ex" lang="en">in Chile, in July, in bed</span></span>
  <b lang="en">On</b><span>superficie, días, fechas → <span class="ex" lang="en">on the desk, on Monday, on a farm</span></span>
  <b lang="en">At</b><span>punto exacto, hora → <span class="ex" lang="en">at home, at 7:00, at night</span></span></div>`],
 ["to","4. To + verbo",`<p>Después de verbos como <b lang="en">want, need, like, prefer</b> va <b>to + verbo</b>: <span class="ex" lang="en">I want to go. I need to study. I prefer to stay.</span></p>
  <p class="qbox">¿Por qué <span lang="en">I'd rather stay</span> no lleva to?</p>
  <p><b lang="en">I'd rather</b> es la forma corta de <b lang="en">I would rather</b>. Aquí <b>'d = would</b>.</p>
  <p><b lang="en">Would</b> es un verbo modal (como can, could, will, should, must). Los modales siempre van seguidos del verbo base, sin to: <span class="ex" lang="en">I can swim. I should go. I would stay.</span> Por eso: <span class="ex" lang="en">I'd rather stay</span> (no <s>to stay</s>).</p>
  <p>En cambio, <b lang="en">prefer</b> es un verbo normal, y los verbos normales sí piden to: <span class="ex" lang="en">I prefer to stay.</span></p>
  <p>No tiene que ver con el perfecto simple. La confusión viene de que 'd también puede ser <b lang="en">had</b> (<span lang="en">I'd eaten = I had eaten</span>, pasado perfecto). Pero en <span lang="en">I'd rather</span>, 'd siempre es would.</p>
  <p>Una excepción para anotar: <span class="ex" lang="en">I'd better go</span> (= I had better go) tampoco lleva to.</p>
  <p class="qbox">Truco: si antes del verbo hay un modal (can, should, would…), no pongas to.</p>`],
 ["there","5. There is / there are",`<p class="ex" lang="en">There is a bed. There are two chairs.</p>`]
];

 ["q2","Why do you want to apply for that job?",`Estructura: <b lang="en">I want to apply because + sujeto + verbo.</b><br><span class="ex" lang="en">I want to apply because I'm interested in this work. I'd like to learn new things.</span>`],
 ["q3","What can you describe about what you see?",`1. <span lang="en">I can see… / There is… / There are…</span><br>2. Dónde: <span lang="en">on the left, on the right, in the middle, next to.</span><br>3. Cómo: adjetivos (<span lang="en">a small green rug</span>).<br>4. Qué hacen: <span lang="en">She is wearing…, He is standing at the door.</span>`]

const TITLES={hoy:"Hoy",palabras:"Palabras",gramatica:"Gramática",errores:"Errores",ruta:"Ruta"};
function render(){
  const v=document.getElementById("view"), ae=document.activeElement, fid=ae&&ae.id;
  let sel=null;try{sel=ae&&ae.selectionStart;}catch(e){}
  const keep={};document.querySelectorAll("#view input[id]:not([data-act]),#view textarea[id]:not([data-act])").forEach(el=>{if(el.value)keep[el.id]=el.value;});
  v.innerHTML=tab==="hoy"?viewHoy():tab==="palabras"?viewPalabras():tab==="gramatica"?viewGramatica():tab==="errores"?viewErrores():viewRuta();
  Object.entries(keep).forEach(([id,val])=>{const el=document.getElementById(id);if(el&&!el.value)el.value=val;});
  document.getElementById("title").textContent=TITLES[tab];
  document.querySelectorAll("nav.tabs button").forEach(b=>b.dataset.tab===tab?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current"));
  if(fid){const el=document.getElementById(fid);if(el&&el!==document.activeElement){el.focus();try{if(sel!=null)el.setSelectionRange(sel,sel);}catch(e){}}}
}

/* ───────── EVENTOS ───────── */
const val=id=>{const el=document.getElementById(id);return el?el.value.trim():"";};
function copyText(txt,msgEl,okMsg){
  const ok=()=>{if(msgEl)msgEl.textContent=okMsg;};
  const fb=()=>{const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");ok();}catch(e){if(msgEl)msgEl.textContent="No se pudo copiar automáticamente.";}ta.remove();};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(ok,fb);else fb();
}
document.querySelector("nav.tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.tab;try{history.replaceState(null,"","#"+tab);}catch(_){}render();window.scrollTo(0,0);});
const view=document.getElementById("view");
view.addEventListener("toggle",e=>{const d=e.target;if(d.dataset&&d.dataset.k)openD[d.dataset.k]=d.open;},true);
view.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  if(a==="say"){speak(b.dataset.t);return;}
  if(a==="trynew"){const w=val("nw");if(w)speak(w);return;}
  if(a==="voz"){D.voz=b.dataset.v;save();render();return;}
  if(a==="day"){const d=addDays(cur,+b.dataset.n);cur=d<FIRST?FIRST:d;render();return;}
  if(a==="morew"){openD.addw=true;render();return;}
  if(a==="addw"){const w=val("nw");if(!w){document.getElementById("nw").focus();return;}
    D.vocab.push({id:uid(),d:cur,w,s:val("ns"),o:val("no")});["nw","ns","no"].forEach(id=>{document.getElementById(id).value="";});
    save("Palabra guardada ✓");render();const nw=document.getElementById("nw");if(nw)nw.focus();return;}
  if(a==="delw"){const x=D.vocab.find(v=>v.id===b.dataset.id);if(x&&confirm("¿Borrar «"+x.w+"»?")){D.vocab=D.vocab.filter(v=>v!==x);save();render();}return;}
  if(a==="ck"){const o=D.ora[cur][+b.dataset.i];o.c=o.c||{};o.c[b.dataset.k]=!o.c[b.dataset.k];save();render();return;}
  if(a==="copyora"){const ora=(D.ora[cur]||[]).map(o=>o.t.trim()).filter(Boolean);
    const txt="Corrige estas oraciones en inglés que escribí hoy. Para cada una dime si está bien; si no, dame la versión corregida y qué regla falló (sujeto, verbo to be, complemento, a/an, orden del adjetivo, in/on/at, this/these, there is/are, to + verbo o modal). Explícamelo en español simple y al final dame mis errores en formato «error → corrección».\n\n"+ora.map((t,i)=>(i+1)+". "+t).join("\n");
    copyText(txt,document.getElementById("copyMsg"),"Copiado ✓ Pégalo en tu chat de inglés.");return;}
  if(a==="adde"){const er=val("ne"),co=val("nc");if(!er||!co){setStatus("Escribe el error y su corrección");return;}
    D.err.push({id:uid(),e:er,c:co,d:TODAY});document.getElementById("ne").value="";document.getElementById("nc").value="";save("Error anotado ✓");render();return;}
  if(a==="dele"){if(confirm("¿Borrar este error?")){D.err=D.err.filter(x=>x.id!==b.dataset.id);save();render();}return;}
  if(a==="addn"){const t=b.dataset.t,tx=val("nn-"+t);if(!tx)return;(D.notas[t]=D.notas[t]||[]).push({id:uid(),t:tx,d:TODAY});document.getElementById("nn-"+t).value="";openD["g-"+t]=true;save("Nota guardada ✓");render();return;}
  if(a==="deln"){if(confirm("¿Borrar esta nota?")){D.notas[b.dataset.t]=(D.notas[b.dataset.t]||[]).filter(n=>n.id!==b.dataset.id);save();render();}return;}
  if(a==="addt"){const t=val("tt");if(!t){document.getElementById("tt").focus();return;}const id="t"+uid();D.temas.push({id,t,b:val("tb")});document.getElementById("tt").value="";document.getElementById("tb").value="";openD["g-"+id]=true;save("Tema agregado ✓");render();return;}
  if(a==="delt"){if(confirm("¿Borrar este tema y sus notas?")){D.temas=D.temas.filter(x=>x.id!==b.dataset.id);delete D.notas[b.dataset.id];save();render();}return;}
  if(a==="mes"){const mk=new Date().toISOString().slice(0,7);const M=D.mes[mk]=D.mes[mk]||{};M[b.dataset.k]=!M[b.dataset.k];save();render();return;}
  if(a==="export"){copyText("CUADERNO INGLES LUCIANO "+TODAY+"\n"+JSON.stringify(D),document.getElementById("expMsg"),"Copiado ✓");return;}
  if(a==="import"){const msg=document.getElementById("impMsg");try{const raw=document.getElementById("impTxt").value;const x=JSON.parse(raw.slice(raw.indexOf("{")));
    if(!x||!Array.isArray(x.vocab)||!Array.isArray(x.err))throw 0;D=Object.assign(JSON.parse(JSON.stringify(SEED)),x);save("Cuaderno importado ✓");render();}
    catch(e){msg.textContent="Ese texto no parece un cuaderno de esta app.";}return;}
});
